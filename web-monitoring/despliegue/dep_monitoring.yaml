apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-monitoring-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-monitoring
  template:
    metadata:
      labels:
        app: react-monitoring
    spec:
      containers:
        - name: react-app
          image: eliaskroug/app-monitoring:1.1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: react-monitoring-service
spec:
  type: LoadBalancer
  selector:
    app: react-monitoring
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  loadBalancerIP: 192.168.49.116
