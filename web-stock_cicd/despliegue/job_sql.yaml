apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-load-dump
  namespace: web-stack
spec:
  template:
    spec:
      containers:
      - name: mysql-client
        image: mysql:5.7
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Esperando a MySQL...";
            until mysqladmin ping -h mysql-service --silent; do
              sleep 2;
            done;
            echo "Cargando dump...";
            mysql -h mysql-service -u root < /sql/db_products.sql
        volumeMounts:
        - name: dump-volume
          mountPath: /sql
      restartPolicy: OnFailure
      volumes:
      - name: dump-volume
        configMap:
          name: mysql-init-dump
