name: Deploy Bot Telegram to DockerHub

on:
  push:
    branches:
      - main  # 👈 ejecuta cuando haces push a main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y pushear imagen
        uses: docker/build-push-action@v5
        with:
          context: ./web-bot-telegram
          file: ./web-bot-telegram/Dockerfile
          push: true
          tags: yourdockerhubusername/telegram-bot:latest
